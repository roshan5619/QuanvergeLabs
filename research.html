  <!-- Applies the saved theme before the page paints, so there's no flash of
       the wrong colours. Must stay inline and stay in <head>. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('quanverge-theme');
        var dark = saved ? saved === 'dark'
                         : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0b1a22');
        }
      } catch (e) { /* storage blocked - fall back to light */ }
    })();
  </script>
